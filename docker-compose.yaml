name: "marketpulse-stream"

services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      stock-net:
        ipv4_address: 172.28.1.1
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  kafka:
    image: bitnamilegacy/kafka:3.3.1
    ports:
      - "9093:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://172.28.1.2:9092
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      stock-net:
        ipv4_address: 172.28.1.2
    volumes:
      - ./scripts/init-kafka.sh:/init-kafka.sh
    entrypoint: ["/bin/bash", "/init-kafka.sh"]
    healthcheck:
      # A plain TCP check: kafka-topics.sh spins up a fresh JVM on every
      # invocation, which routinely exceeds a few seconds under load and
      # was flapping the service to "unhealthy" despite Kafka working fine.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: always

  cassandra:
    image: cassandra:latest
    ports:
      - "9042:9042"
    volumes:
      - ./init-cassandra:/init-cassandra
      - ./scripts/init-cassandra-schema.sh:/init-cassandra-schema.sh
    environment:
      - CASSANDRA_START_RPC=true
    networks:
      stock-net:
        ipv4_address: 172.28.1.3
    entrypoint: ["/bin/bash", "/init-cassandra-schema.sh"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' | grep -q stockdata"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: always

  spark:
    image: bitnamilegacy/spark:3.3.1
    # The image's default UID (1001) has no /etc/passwd entry, which makes
    # Hadoop's UserGroupInformation fail with a KerberosAuthException before
    # spark-submit even gets to our job. Root always resolves cleanly.
    user: "0"
    volumes:
      - ./spark:/opt/bitnami/spark/jobs
      - ./scripts/submit-spark-job.sh:/opt/bitnami/spark/submit-spark-job.sh
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      stock-net:
        ipv4_address: 172.28.1.4
    entrypoint: ["/bin/bash", "/opt/bitnami/spark/submit-spark-job.sh"]
    restart: always

  kafka_producer:
    build:
      context: ./kafka-producer
      dockerfile: kafka_producer.dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      stock-net:
        ipv4_address: 172.28.1.8
    restart: always

  dashboard:
    build:
      context: ./dashboard
      dockerfile: dashboard.dockerfile
    ports:
      - "8050:8050"
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      stock-net:
        ipv4_address: 172.28.1.9
    restart: always

networks:
  stock-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
